# Production Nginx after Certbot issued certificates.
# Paths assume: certbot --nginx -d www.vrazmerdom.ru -d vrazmerdom.ru

upstream vrazmerdom_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name vrazmerdom.ru www.vrazmerdom.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.vrazmerdom.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vrazmerdom.ru;

    ssl_certificate     /etc/letsencrypt/live/www.vrazmerdom.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.vrazmerdom.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.vrazmerdom.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.vrazmerdom.ru;

    ssl_certificate     /etc/letsencrypt/live/www.vrazmerdom.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.vrazmerdom.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://vrazmerdom_next;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }
}
