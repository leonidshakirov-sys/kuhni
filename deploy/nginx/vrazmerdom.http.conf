# Bootstrap HTTP-only config for Certbot.
# After certificates exist, replace with vrazmerdom.ssl.conf.

upstream vrazmerdom_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name vrazmerdom.ru www.vrazmerdom.ru;

    client_max_body_size 50m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.vrazmerdom.ru$request_uri;
    }
}
