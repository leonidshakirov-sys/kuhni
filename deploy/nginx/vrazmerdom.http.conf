# HTTP bootstrap before DNS and certificates.
# Serves the site on port 80 (including by VPS IP) so we can check
# it before switching Cloudflare. After certbot, replace with
# vrazmerdom.ssl.conf.

upstream vrazmerdom_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name vrazmerdom.ru www.vrazmerdom.ru _;

    client_max_body_size 50m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://vrazmerdom_next;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }
}
